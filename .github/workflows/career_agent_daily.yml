name: CareerOps Autonomous Daily Automation

on:
  schedule:
    # Daily 2x (Monday through Sunday):
    # Scheduled at odd minutes (:23) to bypass GitHub Actions top-of-hour & half-hour queue congestion:
    # 1. 08:53 IST (03:23 UTC) - Morning recruiter screening window (new application submissions)
    - cron: '23 3 * * *'
    # 2. 13:53 IST (08:23 UTC) - Post-lunch recruiter review window (new application submissions)
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (true/false)'
        required: true
        default: 'false'
      force_weekly:
        description: 'Force weekly career intelligence report'
        required: false
        default: 'false'

concurrency:
  group: career-agent-daily
  cancel-in-progress: false

jobs:
  career-agent:
    name: Execute Daily Career Automation & Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Restore Database State Cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: |
            naukri_career_agent.sqlite
            artifacts/evidence/
          key: career-agent-db-v6-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            career-agent-db-v6-${{ runner.os }}-
            career-agent-db-v5-

      - name: Fallback Restore Database from Previous Run Artifact
        if: steps.cache-db.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f naukri_career_agent.sqlite ]; then
            echo "Cache miss. Attempting download of latest career-agent-db-state artifact..."
            gh run download --name career-agent-db-state --dir . || echo "No prior database artifact found."
          fi

      - name: Restore Authenticated Session
        env:
          NAUKRI_AUTH_STATE_B64: ${{ secrets.NAUKRI_AUTH_STATE_B64 }}
        run: |
          mkdir -p artifacts
          if [ -n "$NAUKRI_AUTH_STATE_B64" ]; then
            echo "$NAUKRI_AUTH_STATE_B64" | base64 --decode > artifacts/naukri_auth.json
            echo "Authenticated session state restored to artifacts/naukri_auth.json"
          fi

      - name: Run Test Suite Verification
        run: |
          python -m pytest tests/unit

      - name: Execute Career Agent Pipeline
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT || 'sauravskt8@gmail.com' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TIMEZONE: "Asia/Kolkata"
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force_weekly }}" == "true" ] || [ $(date +%u) -eq 5 ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --weekly"
          fi
          if [ -z "$NAUKRI_USERNAME" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --offline"
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" python main.py $EXTRA_FLAGS

      - name: Validate Application Automation Phase Gate
        run: |
          python main.py --validate-phase --today

      - name: Archive Daily, Weekly & Interview Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-agent-reports-${{ github.run_id }}
          path: |
            reports/daily/
            reports/weekly/
            reports/interviews/

      - name: Archive Application Evidence & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-agent-evidence-${{ github.run_id }}
          path: artifacts/evidence/

      - name: Archive Generated Resumes & Interview Packs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-agent-artifacts-${{ github.run_id }}
          path: |
            resumes/generated/
            interviews/

      - name: Persist SQLite Database State Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-agent-db-state
          path: naukri_career_agent.sqlite
          retention-days: 90
          overwrite: true
