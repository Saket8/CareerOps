employment_history:
  - company: "Cognizant"
    client: "KPN (Netherlands)"
    role: "Principal Cloud Engineer (OCI) / Manager-Projects"
    start_date: "2024-11"
    end_date: "2026-07"
    duration: "1.7 yrs"
    responsibilities:
      - "Cloud Architecture & Landing Zones: Owned the architecture of a production-grade, air-gapped Oracle Cloud Infrastructure (OCI) environment for telecom billing platforms (DBSS Revenue Management / BRM modernization), defining landing zone, network domains, connectivity model, and isolation boundaries."
      - "Cloud Architecture & Governance: Produced architecture design documents, technical decision records (TDRs), and operational runbooks covering network topology, platform dependencies, environment patterns, and support procedures, improving implementation clarity and governance traceability."
      - "Network & Trust Architecture: Defined segmentation and trust architecture across OKE, database, storage, bastion, and shared services tiers, establishing private DNS and service discovery across hub-and-spoke VCNs using delegated zones and environment-specific namespace separation."
      - "Kubernetes (OKE) Engineering: Provisioned and managed production private OKE clusters enforcing layered security, blast-radius containment, and network policies, resolving complex OKE operational issues and reducing platform incidents by ~40%."
      - "Stateful Storage & Ingress: Engineered OCI FSS-backed persistent storage (StorageClass, PV, PVC) for stateful telecom billing workloads; configured ALB/NLBs and API Gateways with DNS-based routing and enterprise TLS for secure, scalable external ingress."
      - "Cluster Security & RBAC: Implemented Kubernetes-native RBAC and authentication model in the absence of external identity providers, achieving secure multi-tenant access control entirely within cluster boundaries."
      - "Infrastructure as Code: Automated end-to-end OCI infrastructure provisioning using modular Terraform (networking, compute, OKE clusters, FSS storage), reducing deployment time by ~60% and eliminating configuration drift across environments."
      - "Governance & CI/CD: Developed robust OCI CLI / Bash automation for bulk resource tagging and compliance governance across hundreds of OCI resources; engineered CI/CD pipelines integrating OCI DevOps for automated deployments."
      - "AI-Driven Operations (GenAI CloudOps): Architected and delivered a GenAI-powered CloudOps Dashboard integrating OCI Monitoring, cost analysis, security insights, and automated remediation workflows, pioneering AI-driven operations for KPN's cloud estate."
      - "Air-Gapped ChatOps & Local LLMs: Developed an offline ChatOps CLI using LangChain and local LLMs for secure AI-assisted diagnostics in air-gapped OCI environments, enabling intelligent incident triaging without internet dependency."
      - "Autonomous DB Operations (ODAOS): Spearheaded ODAOS (Oracle Database Autonomous Operations System) implementation, automating complex database operations and reducing manual DBA intervention by ~50%."
      - "Model Context Protocol (MCP) & AI Tooling: Modernized API integrations by migrating legacy frameworks to next-generation AI models via Model Context Protocol (MCP) servers, leveraging Cursor IDE for accelerated cloud development."
      - "Security, IAM & Zero Trust: Designed and executed a successful POC for OCI IAM Database Environment Isolation, hardening non-production environments and establishing a blueprint adopted for production rollout."
      - "Enterprise Federation & SAML: Implemented federated identity integration between OCI and KPN enterprise IAM (Azure Active Directory) using SAML-based SSO; automated OS-level PAM configuration to enforce strict access controls; designed confidential application patterns in OCI IAM."
      - "Leadership & Stakeholder Mentorship: Mentored and supervised junior cloud engineers, setting structured growth goals; collaborated directly with cross-functional stakeholders (identity, network, security, PMO) to align cloud architecture with business requirements."

  - company: "Emerson (EITS)"
    role: "OCI Cloud Administrator"
    start_date: "2018-06"
    end_date: "2024-11"
    duration: "6.5 yrs"
    responsibilities:
      - "Enterprise Cloud Migration: Defined and executed cloud migration strategy from on-premises to OCI (ExaCS and IaaS), architecting VCNs, DRGs, Palo Alto VM-Series Firewalls, and IPSec VPN for secure hybrid connectivity supporting Emerson's global business."
      - "Hub-and-Spoke Networking: Architected hub-and-spoke OCI network topology with NLBs, Application LBs, Network Firewalls, and cross-region/cross-tenancy connectivity solutions supporting enterprise workload migration."
      - "Enterprise IAM Governance: Implemented enterprise IAM governance integrating Okta and Azure AD with OCI Identity Domain for SSO and SCIM provisioning, enforcing strict least-privilege control policies."
      - "Core Infrastructure Provisioning: Led provisioning, configuration, and capacity scaling of OCI services: Compute, ExaDB, ADW, OAC, Linux VMs, Object Storage, and Block Volumes based on business demands."
      - "Centralized Logging & Observability: Implemented centralized logging architecture using OCI Logging Service and Splunk; integrated Datadog, Cloudability, and Infoblox for multi-cloud observability and cost governance across OCI and GCP."
      - "IaC Automation: Utilized Terraform and OCI Resource Manager for Infrastructure-as-Code deployments, driving infrastructure repeatability and eliminating manual provisioning overhead."
      - "Disaster Recovery & SRE: Developed and maintained DR runbooks, network architecture diagrams, and OCI configuration documentation, ensuring operational readiness, high availability, and knowledge continuity."
      - "Performance & Capacity Tuning: Monitored OCI environments using Prometheus and Grafana, performing proactive capacity planning and performance tuning to optimize resource utilization and cloud cost efficiency."
      - "Database Administration: Administered Oracle DB 19c/12c, RAC, and Exadata (on-premise and cloud), managing high-availability backup/recovery (RMAN), Data Guard, patching, cloning, and production upgrades."

  - company: "ITC Infotech"
