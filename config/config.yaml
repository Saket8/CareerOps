# Autonomous Career Agent Configuration

app:
  name: "Naukri Autonomous Career Agent"
  version: "1.0.0"
  timezone: "Asia/Kolkata"
  environment: "production"

schedule:
  cron_expression: "30 3,8 * * *"  # Daily 09:00 IST (03:30 UTC) & 14:00 IST (08:30 UTC)
  timezone: "Asia/Kolkata"
  times_ist:
    - "09:00"  # Morning recruiter login & screening window (new applications)
    - "14:00"  # Post-lunch recruiter review window (new applications)
  days:
    - "monday"
    - "tuesday"
    - "wednesday"
    - "thursday"
    - "friday"
    - "saturday"
    - "sunday"

application:
  match_threshold: 75.0
  high_match_threshold: 85.0
  min_salary_lpa: null  # Raised floor to ₹25 LPA; no ceiling
  undisclosed_salary_allowed: true
  max_applications_per_day: 35
  dry_run: false  # LIVE mode enabled per user preference
  retry_attempts: 3
  retry_backoff_seconds: 5

resume:
  source_path: "resumes/master/Saket_Saurav_OCI.docx"
  output_dir: "resumes/generated"
  auto_modify_master: false
  generate_pdf: true
  generate_docx: true
  ats_validation: true

database:
  db_url: "sqlite:///naukri_career_agent.sqlite"
  echo: false

retention:
  enabled: true
  unqualified_job_days: 14     # Purge rejected/unqualified jobs older than 14 days
  run_history_days: 90         # Retain pipeline execution run logs for 90 days
  market_signal_days: 90       # Retain market trend signals for 90 days
  evidence_scratch_days: 14    # Prune non-confirmed/scratch screenshots older than 14 days
  draft_resume_days: 30        # Prune unapplied draft resumes older than 30 days
  log_days: 14                 # Prune application logs older than 14 days
  auto_vacuum_db: true         # Execute SQLite VACUUM to reclaim disk pages

email:
  enabled: true
  daily_report: true
  weekly_report: true
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  smtp_use_tls: true
  sender_name: "Autonomous Career Agent"
  default_recipient: "sauravskt8@gmail.com"

safety:
  stop_on_captcha: true
  stop_on_mfa: true
  stop_on_payment: true
  stop_on_unknown_question: true
  stop_on_external_redirect: true
  max_daily_requests: 200
  blocked_companies:
    - "Cognizant"
    - "Cognizant Technology Solutions"
    - "CTS"
    - "Cognizant Cloud Solutions"
    - "Cognizant Worldwide"

search:
  enabled: true
  max_jobs_per_query: 30
  locations:
    - "Pan India"
    - "Remote"
    - "Hybrid"
    - "India"
  experience_range:
    min_years: 10
    max_years: 16
  queries:
    oracle_cloud:
      - "Oracle Cloud Infrastructure Architect"
      - "OCI Cloud Architect"
      - "Oracle Cloud Administrator"
      - "OCI Cloud Administrator"
      - "OCI Architect"
      - "Principal OCI Architect"
      - "OCI Solutions Architect"
      - "Oracle Cloud Infrastructure Administrator"
      - "Oracle Cloud Lead"
      - "OCI DevOps Architect"
      - "Oracle Cloud Migration Architect"
      - "OCI Platform Architect"
    llm_ops_ai:
      - "LLMOps Architect"
      - "LLMOps Engineer"
      - "AI Architect"
      - "GenAI Architect"
      - "AI Solutions Architect"
      - "AI Platform Architect"
      - "Enterprise AI Architect"
      - "Agentic AI Architect"
      - "Cloud GenAI Architect"
      - "GenAI Cloud Architect"
      - "Generative AI Architect"
      - "AI Platform Security"
      - "AI Infrastructure Architect"
