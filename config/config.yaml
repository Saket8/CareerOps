# Autonomous Career Agent Configuration

app:
  name: "Naukri Autonomous Career Agent"
  version: "1.0.0"
  timezone: "Asia/Kolkata"
  environment: "production"

schedule:
  cron_expression: "23 3 * * 1-5"  # Mon-Fri 08:53 IST (03:23 UTC) - Morning recruiter screening window
  timezone: "Asia/Kolkata"
  times_ist:
    - "08:53"  # Morning recruiter login & screening window (single daily run)
  days:
    - "monday"
    - "tuesday"
    - "wednesday"
    - "thursday"
    - "friday"

application:
  match_threshold: 70.0
  # Salary floor is loaded dynamically from .env (MIN_ACCEPTABLE_SALARY_LPA or CURRENT_SALARY_LPA)
  min_salary_lpa: null  # Resolved from .env (Single Source of Truth)
  undisclosed_salary_allowed: true
  max_applications_per_day: 25  # Hard cap for total applications per daily pipeline run
  max_run_duration_seconds: 3600  # 60 minute hard time limit per daily execution to prevent runaway jobs
  dry_run: false  # LIVE mode enabled per user preference
  retry_attempts: 3
  retry_backoff_seconds: 5

resume:
  source_path: "resumes/master/Saket_Saurav_OCI.docx"
  output_dir: "resumes/generated"
  auto_modify_master: false
  generate_pdf: true
  generate_docx: true
  ats_validation: true
  reupload_daily: true  # Re-upload master CV to Naukri profile every weekday morning to refresh Resdex rank

database:
  db_url: "sqlite:///naukri_career_agent.sqlite"
  echo: false

retention:
  enabled: true
  unqualified_job_days: 14     # Purge rejected/unqualified jobs older than 14 days
  run_history_days: 90         # Retain pipeline execution run logs for 90 days
  market_signal_days: 90       # Retain market trend signals for 90 days
  evidence_scratch_days: 14    # Prune non-confirmed/scratch screenshots older than 14 days
  draft_resume_days: 30        # Prune unapplied draft resumes older than 30 days
  log_days: 14                 # Prune application logs older than 14 days
  auto_vacuum_db: true         # Execute SQLite VACUUM to reclaim disk pages

email:
  enabled: true
  daily_report: true
  weekly_report: true
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  smtp_use_tls: true
  sender_name: "Autonomous Career Agent"
  default_recipient: "sauravskt8@gmail.com"

safety:
  stop_on_captcha: true
  stop_on_mfa: true
  stop_on_payment: true
  stop_on_unknown_question: true
  stop_on_external_redirect: true
  max_daily_requests: 200
  blocked_companies:
    - "Cognizant"
    - "Cognizant Technology Solutions"
    - "CTS"
    - "Cognizant Cloud Solutions"
    - "Cognizant Worldwide"

search:
  enabled: true
  max_jobs_per_query: 30
  max_discovery_duration_seconds: 600  # 10 minute ceiling on discovery to prevent runaway runs
  locations:
    - "Pan India"
    - "Remote"
    - "Hybrid"
    - "India"
  experience_range:
    min_years: 10
    max_years: 16
  queries:
    oracle_cloud:
      - "Principal OCI Architect"
      - "OCI Cloud Architect"
      - "Oracle Cloud Infrastructure Architect"
      - "OCI Solutions Architect"
      - "OCI DevOps Architect"
    oci_security_iam:
      - "OCI Security Architect"
      - "Oracle Cloud Security Architect"
      - "OCI IAM Architect"
    oci_microservices_cloudnative:
      - "OCI Cloud Native Architect"
      - "Oracle Cloud OKE Architect"
      - "OCI Kubernetes Architect"
    llm_ops_ai:
      - "GenAI Architect"
      - "Agentic AI Architect"
      - "AI Solutions Architect"
      - "Cloud GenAI Architect"

linkedin:
  enabled: true
  auto_submit: true  # Fully unattended submission per user directive (no manual review)
  max_applications_per_day: 25
  user_data_dir: "/u01/CareerOps/.li_profile"
  auth_state_path: "artifacts/linkedin_auth.json"
  email_alerts: true
  require_visa_sponsorship: true  # Strictly require employer visa sponsorship for candidates from India
  require_relocation: true         # Strictly require relocation assistance package
  work_modes:
    - "onsite"
    - "hybrid"
    - "remote"
  target_regions:
    - name: "Europe"
      location: "Europe"
    - name: "Nordics"
      location: "Nordics"
    - name: "Australia"
      location: "Australia"
    - name: "United States"
      location: "United States"
    - name: "United Kingdom"
      location: "United Kingdom"
    - name: "Canada"
      location: "Canada"
    - name: "Singapore"
      location: "Singapore"
    - name: "UAE"
      location: "United Arab Emirates"
  queries:
    - "OCI Architect visa sponsorship"
    - "Oracle Cloud Infrastructure Architect visa sponsorship"
    - "Cloud Architect relocation"
    - "OCI Architect relocation"
    - "AI Architect visa sponsorship"
    - "GenAI Architect relocation"
    - "Cloud Architect visa sponsorship"
    - "OCI Architect"
    - "Oracle Cloud Infrastructure Architect"
    - "Principal Cloud Architect"
    - "AI Architect"
    - "GenAI Architect"

telegram:
  enabled: true
  bot_token: ""  # Loaded from TELEGRAM_BOT_TOKEN in .env
  chat_id: "-1003761096081"
  notify_on_applied: false           # Do NOT send per-job submission alerts to Telegram (all applies delivered in morning email)
  notify_on_interview: true         # Instant alert for incoming recruiter interview invites
  notify_on_daily_summary: true     # Daily summary after morning run finishes
  notify_on_recruiter_draft: true   # Telegram alerts ONLY for high-value recruiter 1-to-1 message drafts
  min_match_score_for_draft: 85.0   # Only high-value roles (>= 85% match)
  max_draft_alerts_per_run: 5       # Cap to top high-value opportunities per day
