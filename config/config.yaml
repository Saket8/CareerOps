# Autonomous Career Agent Configuration

app:
  name: "Naukri Autonomous Career Agent"
  version: "1.0.0"
  timezone: "Asia/Kolkata"
  environment: "production"

schedule:
  cron_expression: "23 3 * * *"  # Daily 08:53 IST (03:23 UTC) - Mon-Fri full pipeline, Sat-Sun resume refresh only
  timezone: "Asia/Kolkata"
  times_ist:
    - "08:53"  # Morning recruiter login & screening window (single daily run)
  days:
    - "monday"
    - "tuesday"
    - "wednesday"
    - "thursday"
    - "friday"

application:
  match_threshold: 70.0
  # Salary floor is loaded dynamically from .env (MIN_ACCEPTABLE_SALARY_LPA or CURRENT_SALARY_LPA)
  min_salary_lpa: null  # Resolved from .env (Single Source of Truth)
  undisclosed_salary_allowed: true
  max_applications_per_day: 50  # Cap allowing 30+ Naukri confirmed per day
  max_naukri_per_day: 45  # Allow up to 45 confirmed applies on Naukri per day
  target_naukri_per_day: 35  # Target 30-35 confirmed applies on Naukri per day with LinkedIn disabled
  target_linkedin_per_day: 0   # LinkedIn disabled per user configuration
  max_attempts_per_run: 75   # Allows pipeline to reach target confirmed applies on Naukri
  max_naukri_attempts: 70
  max_naukri_phase_seconds: 4500  # 75 min budget for Naukri to comfortably hit 30+ applies
  max_run_duration_seconds: 5400  # 90 minute internal ceiling to allow comprehensive applications and guaranteed email dispatch
  max_catchup_duration_seconds: 3600  # 60 minute ceiling for post-run healer
  dry_run: false  # LIVE mode enabled per user preference
  retry_attempts: 3
  retry_backoff_seconds: 5

resume:
  source_path: "resumes/master/Saket_Saurav_OCI.docx"
  output_dir: "resumes/generated"
  auto_modify_master: false
  generate_pdf: true
  generate_docx: true
  ats_validation: true
  reupload_daily: true  # Re-upload master CV to Naukri profile every weekday morning to refresh Resdex rank
  reupload_weekends: true  # Re-upload master CV on Saturdays & Sundays (only resume refresh on Naukri, nothing else)

database:
  db_url: "sqlite:///naukri_career_agent.sqlite"
  echo: false

retention:
  enabled: true
  mailbox_retention_enabled: true
  purge_trash: true            # Permanently expunge CareerOps emails from [Gmail]/Bin (Trash)
  max_careerops_emails_per_folder: 3  # Maintain at most 3 latest CareerOps emails in INBOX and Sent Mail
  unqualified_job_days: 14     # Purge rejected/unqualified jobs older than 14 days
  run_history_days: 90         # Retain pipeline execution run logs for 90 days
  market_signal_days: 90       # Retain market trend signals for 90 days
  evidence_scratch_days: 14    # Prune non-confirmed/scratch screenshots older than 14 days
  draft_resume_days: 30        # Prune unapplied draft resumes older than 30 days
  log_days: 14                 # Prune application logs older than 14 days
  auto_vacuum_db: true         # Execute SQLite VACUUM to reclaim disk pages

email:
  enabled: true
  daily_report: true
  weekly_report: true
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  smtp_use_tls: true
  sender_name: "Autonomous Career Agent"
  default_recipient: "sauravskt8@gmail.com"

safety:
  stop_on_captcha: true
  stop_on_mfa: true
  stop_on_payment: true
  stop_on_unknown_question: true
  stop_on_external_redirect: true
  max_daily_requests: 200
  blocked_companies:
    - "Cognizant"
    - "Cognizant Technology Solutions"
    - "CTS"
    - "Cognizant Cloud Solutions"
    - "Cognizant Worldwide"
  excluded_job_titles:
    - "data architect"
    - "data architecture"
    - "big data"
    - "data engineer"
    - "data engineering"
    - "data platform"
    - "data warehouse"
    - "data warehousing"
    - "data lake"
    - "data lakehouse"
    - "data analytics"
    - "data modeler"
    - "data modeling"
    - "data governance"
    - "data pipeline"
    - "data scientist"
    - "data science"
    - "data lead"
    - "database architect"
    - "data center architect"
    - "data centre architect"
    - "snowflake"
    - "databricks"

search:
  enabled: true
  max_jobs_per_query: 30
  max_discovery_duration_seconds: 600  # 10 minute ceiling on discovery to prevent runaway runs
  locations:
    - "Pan India"
    - "Remote"
    - "Hybrid"
    - "India"
  experience_range:
    min_years: 10
    max_years: 16
  queries:
    tier1_gcc_enterprise_cloud:
      - "Enterprise Cloud Architect"
      - "Cloud Solutions Architect"
      - "Principal Cloud Infrastructure Architect"
      - "Cloud Platform Architect"
      - "Cloud Security Architect"
      - "Staff Cloud Architect"
    hyperscaler_solutions_architecture:
      - "Solutions Architect OCI"
      - "Cloud Solutions Architect Azure"
      - "AWS Solutions Architect"
      - "Cloud Infrastructure Architect"
      - "Principal Solutions Architect"
      - "Customer Engineer Cloud"
    oracle_cloud:
      - "Principal OCI Architect"
      - "OCI Cloud Architect"
      - "Oracle Cloud Infrastructure Architect"
      - "OCI Solutions Architect"
      - "OCI DevOps Architect"
    oci_security_iam:
      - "OCI Security Architect"
      - "Oracle Cloud Security Architect"
      - "OCI IAM Architect"
    oci_microservices_cloudnative:
      - "OCI Cloud Native Architect"
      - "Oracle Cloud OKE Architect"
      - "OCI Kubernetes Architect"
    llm_ops_ai:
      - "GenAI Architect"
      - "Agentic AI Architect"
      - "AI Solutions Architect"
      - "Cloud GenAI Architect"
  tier_1_priority_companies:
    - "Oracle"
    - "JPMorgan"
    - "JP Morgan"
    - "Goldman Sachs"
    - "Wells Fargo"
    - "Walmart"
    - "Walmart Global Tech"
    - "Target"
    - "Fidelity"
    - "Fidelity Investments"
    - "Optum"
    - "UnitedHealth"
    - "Barclays"
    - "Morgan Stanley"
    - "BNY Mellon"
    - "State Street"
    - "Standard Chartered"
    - "Citi"
    - "Citibank"
    - "Amazon"
    - "AWS"
    - "Microsoft"
    - "Google"
    - "Google Cloud"
    - "Cisco"
    - "VMware"
    - "Broadcom"
    - "Lowe's"
    - "PayPal"
    - "ServiceNow"
    - "Adobe"
    - "Salesforce"
    - "Snowflake"

linkedin:
  enabled: false
  auto_submit: true  # Fully unattended submission per user directive (no manual review)
  max_applications_per_day: 25
  user_data_dir: "/u01/CareerOps/.li_profile"
  auth_state_path: "artifacts/linkedin_auth.json"
  email_alerts: true
  require_visa_sponsorship: false  # Allow both international and domestic roles (negative exclusions still enforced)
  require_relocation: false        # Relocation optional/bonus
  work_modes:
    - "onsite"
    - "hybrid"
    - "remote"
  per_country_target: 3  # Target 2-3 confirmed applications per country per user directive
  target_regions:
    - name: "United States"
      location: "United States"
    - name: "United Kingdom"
      location: "United Kingdom"
    - name: "Germany"
      location: "Germany"
    - name: "Netherlands"
      location: "Netherlands"
    - name: "Sweden"
      location: "Sweden"
    - name: "Norway"
      location: "Norway"
    - name: "Ireland"
      location: "Ireland"
    - name: "Switzerland"
      location: "Switzerland"
    - name: "India"
      location: "India"
  queries:
    - "Oracle Cloud Architect"
    - "OCI Architect"
    - "Oracle Cloud Infrastructure Architect"
    - "Principal Cloud Architect"
    - "Enterprise Cloud Architect"

telegram:
  enabled: false
  bot_token: ""  # Loaded from TELEGRAM_BOT_TOKEN in .env
  chat_id: "-1003761096081"
  notify_on_applied: false           # Do NOT send per-job submission alerts to Telegram (all applies delivered in morning email)
  notify_on_interview: false        # Telegram alerts disabled per user directive
  notify_on_daily_summary: false    # Telegram alerts disabled per user directive
  notify_on_recruiter_draft: false  # Telegram alerts disabled per user directive
  min_match_score_for_draft: 85.0   # Only high-value roles (>= 85% match)
  max_draft_alerts_per_run: 0       # Disabled
