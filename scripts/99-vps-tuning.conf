# ==============================================================================
# OCI Micro VPS Low-Memory & CPU Workload Optimization
# ==============================================================================

# 1. Swappiness: Set to 80 so idle/cold background pages are pushed into fast compressed
#    ZRAM (priority 100 with 4:1 compression), freeing up physical uncompressed RAM
#    for heavy active workloads (Playwright, Python, Chromium).
vm.swappiness = 80

# 2. VFS Cache Pressure: Set to 100 so the kernel proactively reclaims dentries and
#    inodes alongside pagecache instead of locking them in memory.
vm.vfs_cache_pressure = 100

# 3. Min Free Kbytes: Reduce from 42 MB to 16 MB. The default 42 MB locks away 4.5% of
#    the total 945 MB RAM as an untouchable kernel reserve. 16 MB is safe and frees
#    ~26 MB directly to user workloads.
vm.min_free_kbytes = 16384

# 4. Dirty Memory Ratios: Flush dirty pages early to disk/swap before buffers balloon.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# 5. Overcommit Memory: Keep standard heuristic (0) to protect against runaway allocs.
vm.overcommit_memory = 0
